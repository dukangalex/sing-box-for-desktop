<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AngelaBox</title>
    <script>
      try {
        const storedTheme = window.desktop && window.desktop.preferences && window.desktop.preferences.initial
          ? window.desktop.preferences.initial.theme
          : undefined;
        document.documentElement.dataset.theme =
          storedTheme === "dark" ||
          (storedTheme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
        const storedAccent = window.desktop && window.desktop.preferences && window.desktop.preferences.initial
          ? window.desktop.preferences.initial.accent
          : undefined;
        document.documentElement.dataset.accent =
          typeof storedAccent === "string" && /^[a-z]+$/.test(storedAccent)
            ? storedAccent
            : "default";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
        document.documentElement.dataset.accent = "default";
      }
    </script>
    <style>
      html, body, #root {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        color: #e6e6e6;
        font: 15px/1.4 system-ui, sans-serif;
        background: #1e1e1e;
        z-index: 9999;
      }
      #splash span {
        box-sizing: border-box;
        width: 28px;
        height: 28px;
        border: 2px solid #3a3a3a;
        border-top-color: #e6e6e6;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      body.app-ready #splash {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="splash"><span></span><div>AngelaBox</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
